name: "CI"
on:
  push:
    branches:
    - main
  pull_request:

concurrency: 
  group: ${{ github.ref }}-ci
  cancel-in-progress: true

jobs:
  build-nix:
    name: "Build using nix and cabal"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: prepare-nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            substituters        = https://hydra.iohk.io https://iohk.cachix.org https://cache.nixos.org/
            trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= iohk.cachix.org-1:DpRUyj7h7V830dp/i6Nti+NEO2/nhblbov/8MW7Rqoo= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            allow-import-from-derivation = true

      - name: Check generated files
        run: |
          ./update-generated-files.sh
          git diff --exit-code src/ui/src/generated
          git diff --exit-code src/openapi

      - name: Build in nix shell
        run: |
          nix develop --accept-flake-config --command bash -c 'cabal update'
          nix develop --accept-flake-config --command bash -c 'cabal build --enable-tests all'
